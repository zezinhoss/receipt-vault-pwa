<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Vault Scanner</title>
  
  <meta name="application-name" content="Vault">
  <meta name="apple-mobile-web-app-title" content="Vault">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#facc15">
  
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a0a0a; background-image: radial-gradient(circle at top right, #2a2a2a 0%, #0a0a0a 60%); color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
    .glass-panel { background: rgba(30,30,30,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 40px 30px; border-radius: 24px; border: 1px solid rgba(250,204,21,0.15); box-shadow: 0 25px 50px rgba(0,0,0,0.5); width: 100%; max-width: 360px; text-align: center; box-sizing: border-box; }
    h3 { color: #facc15; font-size: 16px; font-weight: 600; letter-spacing: 2px; margin-top: 0; margin-bottom: 6px; }
    p { color: #888; font-size: 13px; font-weight: 300; margin-bottom: 30px; }
    .pin-container { display: flex; gap: 12px; justify-content: center; margin-bottom: 10px; }
    .pin-box { width: 50px; height: 60px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #facc15; font-size: 24px; text-align: center; outline: none; transition: all 0.3s ease; }
    .pin-box:focus { border-color: #facc15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.2); background: rgba(0, 0, 0, 0.6); }
    .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    select { flex: 1; appearance: none; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #ddd; padding: 14px 12px; font-size: 13px; outline: none; transition: border 0.3s ease; text-align: center; }
    select:focus { border-color: #facc15; color: #fff; }
    .toggle-btn { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 14px 10px; color: #888; font-size: 14px; text-align: center; cursor: pointer; transition: all 0.3s; box-sizing: border-box; user-select: none; }
    .toggle-btn.active { border-color: #facc15; box-shadow: 0 0 10px rgba(250,204,21,0.2); }
    .toggle-btn.active .t-text { color: #facc15; font-weight: 600; text-shadow: 0 0 5px rgba(250,204,21,0.4); }
    .btn { display: block; width: 100%; background: transparent; color: #ddd; padding: 16px; border-radius: 12px; font-size: 13px; font-weight: 400; letter-spacing: 1px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; margin-bottom: 12px; box-sizing: border-box; text-transform: uppercase; }
    .btn-primary { background: rgba(250, 204, 21, 0.9); color: #000; border: none; font-weight: 600; }
    .btn:hover { background: rgba(255, 255, 255, 0.05); }
    .btn-primary:hover { background: #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.4); }
    input[type='file'] { display: none; }
    #status { margin-top: 20px; font-size: 13px; color: #888; font-weight: 300; }
    .error-text { color: #ef4444!important; }
    .success-text { color: #22c55e!important; }
    .loading-text { color: #facc15!important; }
    .preview-zone img { max-width: 100%; max-height: 160px; margin-top: 15px; border-radius: 8px; display: none; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class='glass-panel'>
    
    <div id='login-view'>
      <h3>SECURE VAULT</h3>
      <p>Restricted Access</p>
      <div class="pin-container" id="pin-container">
        <input type="text" class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off">
        <input type="text" class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off">
        <input type="text" class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off">
        <input type="text" class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off">
      </div>
      <div id='login-status' style='margin-top:15px;color:#ef4444;font-size:13px;'></div>
    </div>
    
    <div id='app-view' style='display:none;'>
      <h3>EXPENSE SCAN</h3>
      <p>Document Ingestion</p>
      
      <div class="input-group">
        <select id='monthOverride'>
          <option value='auto'>Auto Month</option>
          <option value='1'>January</option>
          <option value='2'>February</option>
          <option value='3'>March</option>
          <option value='4'>April</option>
          <option value='5'>May</option>
          <option value='6'>June</option>
          <option value='7'>July</option>
          <option value='8'>August</option>
          <option value='9'>September</option>
          <option value='10'>October</option>
          <option value='11'>November</option>
          <option value='12'>December</option>
        </select>
      </div>
      
      <div class="input-group" style="margin-bottom:25px;">
        <div class="toggle-btn" id="btn-digital" onclick="toggleDigital()">
          <span class="t-text" id="text-digital">Digital?</span>
        </div>
        <div class="toggle-btn" id="btn-cash" onclick="toggleCash()">
          <span class="t-text" id="text-cash">In Cash?</span>
        </div>
      </div>
      
      <div id='inputContainer'>
        <label class='btn btn-primary'>Open Camera
          <input type='file' accept='image/jpeg,image/png,image/tiff' capture='environment' onchange='handleFile(this)'>
        </label>
        <label class='btn'>Open Gallery
          <!-- The strictly defined accept rule allows PDFs -->
          <input type='file' accept='image/jpeg,image/png,image/tiff,image/webp,application/pdf,.pdf' onchange='handleFile(this)'>
        </label>
      </div>
      
      <!-- The upload triggers manually so you have time to set the toggles above -->
      <button id='retryBtn' class='btn btn-primary' style='display:none;' onclick='runAPI()'>Upload Document</button>
      <button id='newBtn' class='btn' style='display:none;' onclick='resetForm()'>Scan Another</button>
      
      <div class='preview-zone'><img id='preview' src='' alt='Preview'></div>
      <div id='status'>Awaiting Document...</div>
    </div>
  </div>

  <script>
    // ==========================================
    // REQUIRED: PASTE YOUR APPS SCRIPT URL HERE
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyKDcWrorTdZq3zBPZ9u7O1f7Vun5Lgs8sWN2tcflZe1cvEdy2m-aZQlBdvE2A0TSpdCA/exec";

    var cachedBase64 = '', cachedFullImgSrc = '', cachedMimeType = '', cachedPin = '', cachedForcedMonth = 'auto', isDigital = false, isCash = false;
    
    // Background Service Worker for Native App & OS Share Sheet Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        console.log('SW Registered successfully');
      }).catch(err => console.error('SW Registration Failed', err));
    }

    // Auto-advancing PIN Pad
    const pinBoxes = document.querySelectorAll('.pin-box');
    var rawPin = ['','','',''];
    pinBoxes.forEach((box,index) => {
      box.addEventListener('input', (e) => {
        var val = box.value.replace(/•/g,'');
        if(val.length > 0){
          rawPin[index] = val.charAt(val.length-1);
          box.value = '•';
          if(index < pinBoxes.length - 1){ pinBoxes[index+1].focus(); }
          else { unlockApp(); }
        } else { rawPin[index] = ''; }
      });
      box.addEventListener('keydown', (e) => {
        if(e.key === 'Backspace' && box.value === '' && index > 0){
          rawPin[index-1] = ''; pinBoxes[index-1].value = ''; pinBoxes[index-1].focus();
        }
      });
    });

    // High-speed API router (bypasses standard CORS preflight using text/plain)
    async function callBackendAPI(actionName, payloadData) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: actionName, data: payloadData })
        });
        return await response.json(); 
      } catch (e) {
        throw new Error("Network connection failed.");
      }
    }

    async function unlockApp() {
      var pin = rawPin.join('');
      if(pin.length < 4) return;
      document.getElementById('login-status').innerText = 'Verifying...';
      document.getElementById('login-status').style.color = '#facc15';
      
      try {
        const res = await callBackendAPI('verifyPin', { pin: pin });
        if(res){
          cachedPin = pin;
          document.getElementById('login-view').style.display = 'none';
          document.getElementById('app-view').style.display = 'block';
          checkForSharedFiles();
        } else {
          document.getElementById('login-status').innerText = 'Invalid Access PIN';
          document.getElementById('login-status').style.color = '#ef4444';
          rawPin = ['','','',''];
          Array.from(pinBoxes).forEach(b => b.value='');
          pinBoxes[0].focus();
        }
      } catch (err) {
        document.getElementById('login-status').innerText = 'Server Error. Check connection.';
      }
    }

    function checkForSharedFiles() {
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ action: 'get-shared-file' });
      }
    }

    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data && event.data.file) {
        setStatus('Shared file detected!', 'success');
        const dt = new DataTransfer();
        dt.items.add(event.data.file);
        handleFile({ files: dt.files }); 
      }
    });

    function toggleDigital(){
      isDigital = !isDigital;
      var btn = document.getElementById('btn-digital');
      var txt = document.getElementById('text-digital');
      if(isDigital){ btn.classList.add('active'); txt.innerText='Digital ✓'; }
      else { btn.classList.remove('active'); txt.innerText='Digital?'; }
    }
    
    function toggleCash(){
      isCash = !isCash;
      var btn = document.getElementById('btn-cash');
      var txt = document.getElementById('text-cash');
      if(isCash){ btn.classList.add('active'); txt.innerText='In Cash ✓'; }
      else { btn.classList.remove('active'); txt.innerText='In Cash?'; }
    }
    
    function setStatus(msg, type){ 
        var el = document.getElementById('status'); 
        el.innerHTML = msg; 
        el.className = type + '-text'; 
    }
    function disableButtons(){ 
        var btn = document.getElementById('newBtn'); 
        if(btn){ btn.style.display='block'; btn.disabled=true; btn.style.opacity='0.4'; }
    }
    function enableButtons(){ 
        var btn = document.getElementById('newBtn'); 
        if(btn){ btn.style.display='block'; btn.disabled=false; btn.style.opacity='1'; }
    }

    // Core function to read the image/PDF and compress it using the HTML5 Canvas Engine
    function handleFile(inputEl){
      if(!inputEl.files.length) return;
      document.getElementById('inputContainer').style.display='none';
      var file = inputEl.files[0];
      var mimeType = file.type;
      setStatus('Compacting asset...','loading');
      
      if(mimeType === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
        // PDFs bypass the canvas and are ingested raw directly
        var reader = new FileReader();
        reader.onload = function(e){
          cachedBase64 = e.target.result.split(',')[1];
          cachedFullImgSrc = e.target.result;
          cachedMimeType = 'application/pdf';
          document.getElementById('preview').style.display = 'none';
          document.getElementById('retryBtn').style.display = 'block'; // Shows Upload Button
          setStatus('Asset ready. Confirm options and press Upload.', 'success');
        };
        reader.readAsDataURL(file);
      } else {
        // High-performance image compactor
        var reader = new FileReader();
        reader.onload = function(e){
          var img = new Image();
          img.onload = function(){
            var canvas = document.createElement('canvas');
            // 2400px Golden resolution maximum cap
            var maxW = 2400, maxH = 2400, w = img.width, h = img.height;
            if(w > maxW || h > maxH){
              if(w > h){ h *= maxW / w; w = maxW; }
              else { w *= maxH / h; h = maxH; }
            }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img,0,0,w,h);
            
            // Compacting to 90% JPEG quality
            var dataUrl = canvas.toDataURL('image/jpeg', 0.90);
            cachedBase64 = dataUrl.split(',')[1];
            cachedFullImgSrc = dataUrl;
            cachedMimeType = 'image/jpeg';
            document.getElementById('preview').src = dataUrl;
            document.getElementById('preview').style.display = 'inline-block';
            document.getElementById('retryBtn').style.display = 'block'; // Shows Upload Button
            setStatus('Asset ready. Confirm options and press Upload.', 'success');
          };
          img.onerror = function(){
            cachedBase64 = e.target.result.split(',')[1];
            cachedFullImgSrc = e.target.result;
            cachedMimeType = mimeType;
            document.getElementById('retryBtn').style.display = 'block';
            setStatus('Asset ready. Confirm options and press Upload.', 'success');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    async function runAPI(){
      cachedForcedMonth = document.getElementById('monthOverride').value;
      
      setStatus('Transmitting... Safe to pocket your phone! 🚀','loading');
      document.getElementById('retryBtn').style.display='none';
      disableButtons();
      
      const payload = {
        base64: cachedBase64,
        mimeType: cachedMimeType,
        pin: cachedPin,
        forcedMonth: cachedForcedMonth,
        isCash: isCash,
        isDigital: isDigital
      };

      try {
        const res = await callBackendAPI('processSecureReceipt', payload);
        
        if(res.status === 'success'){
          finalizeUpload(cachedFullImgSrc, res.data, cachedPin);
        } else {
          setStatus('Extraction Failed: ' + res.error, 'error');
          document.getElementById('retryBtn').style.display = 'block';
          enableButtons();
        }
      } catch (err) {
        setStatus('Connection Lost: ' + err.message, 'error');
        document.getElementById('retryBtn').style.display = 'block';
        enableButtons();
      }
    }

    async function finalizeUpload(src, aiData, pin){
      setStatus('Transmitting... Safe to pocket your phone! 🚀','loading');
      var rawImageBase64 = src.split(',')[1];
      
      const payload = {
        base64: rawImageBase64,
        aiData: aiData,
        pin: pin
      };

      try {
        const r = await callBackendAPI('saveFinalData', payload);
        if(r.status === 'success'){
          setStatus('Success!<br>' + r.file, 'success');
          enableButtons();
        } else {
          // THIS DISPLAYS THE DUPLICATE UPLOAD RED TEXT
          setStatus('Archive Error: ' + r.error, 'error'); 
          document.getElementById('retryBtn').style.display = 'block';
          enableButtons();
        }
      } catch(err) {
        setStatus('Drive Save Error: ' + err.message, 'error');
        document.getElementById('retryBtn').style.display = 'block';
        enableButtons();
      }
    }

    function resetForm(){
      setStatus('Awaiting Document...','');
      document.getElementById('preview').style.display='none';
      document.getElementById('preview').src='';
      document.querySelectorAll('input[type=file]').forEach(i => i.value='');
      document.getElementById('retryBtn').style.display='none';
      document.getElementById('newBtn').style.display='none';
      document.getElementById('inputContainer').style.display='block';
      
      // Reset Toggles
      isDigital = false;
      document.getElementById('btn-digital').classList.remove('active');
      document.getElementById('text-digital').innerText = 'Digital?';
      
      isCash = false;
      document.getElementById('btn-cash').classList.remove('active');
      document.getElementById('text-cash').innerText = 'In Cash?';
      
      document.getElementById('monthOverride').value = 'auto';
    }
  </script>
</body>
</html>
